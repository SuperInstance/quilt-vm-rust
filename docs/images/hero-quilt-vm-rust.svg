<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="rforge"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="320" fill="#0F172A"/>
  <!-- forge glow -->
  <ellipse cx="500" cy="220" rx="120" ry="60" fill="#7C2D12" opacity="0.5"/>
  <ellipse cx="500" cy="200" rx="40" ry="30" fill="#F59E0B" filter="url(#rforge)"/>
  <!-- workbench -->
  <rect x="50" y="180" width="540" height="20" fill="#451A03"/>
  <!-- 5 tools on bench -->
  <g font-family="ui-monospace,monospace" font-size="11" font-weight="bold" fill="#FFF">
    <rect x="80" y="155" width="60" height="22" fill="#DC2626" rx="2"/>
    <text x="110" y="170" text-anchor="middle">BIND</text>
    <rect x="160" y="155" width="60" height="22" fill="#F59E0B" rx="2"/>
    <text x="190" y="170" text-anchor="middle">LINK</text>
    <rect x="240" y="155" width="80" height="22" fill="#10B981" rx="2"/>
    <text x="280" y="170" text-anchor="middle">EFFECT</text>
    <rect x="340" y="155" width="60" height="22" fill="#3B82F6" rx="2"/>
    <text x="370" y="170" text-anchor="middle">VIEW</text>
    <rect x="420" y="155" width="60" height="22" fill="#A855F7" rx="2"/>
    <text x="450" y="170" text-anchor="middle">TICK</text>
  </g>
  <!-- anvil with rider shape -->
  <g transform="translate(80,250)">
    <rect x="0" y="0" width="80" height="20" fill="#374151"/>
    <rect x="20" y="-10" width="40" height="10" fill="#4B5563"/>
    <circle cx="40" cy="-25" r="6" fill="#FCD34D"/>
    <rect x="34" y="-22" width="12" height="20" fill="#7C3AED" rx="1"/>
  </g>
  <text x="320" y="290" text-anchor="middle" fill="#FCD34D" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="600">THE WORKSHOP · FIVE TOOLS · ONE ANVIL</text>
  <text x="320" y="310" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif,system-ui" font-size="11">the substrate, hardened. safe. fast. zero-cost.</text>
</svg>
